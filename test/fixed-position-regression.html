<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Viewport fixed / parent absolute regression</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/24px Inter, sans-serif; background: #f5f7fb; }
  #document { display: flex; flex-direction: column; padding: 40px; gap: 24px; }
  #long-content { height: 2200px; flex-shrink: 0; background: white; }
  #clipped-parent { position: relative; margin-left: 100px; width: 800px; height: 240px; overflow: hidden; border: 2px solid #ccd4e0; }
  #absolute-card { position: absolute; left: 240px; right: 0; bottom: 0; height: 76px; background: #e0ebff; }
  #fixed-toolbar { position: fixed; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; left: 240px; right: 0; bottom: 0; height: 76px; z-index: 20; background: white; box-shadow: 0 -2px 8px #0002; }
  #fixed-toolbar p { margin: 0; }
  #toolbar-absolute { position: absolute; right: 8px; top: 4px; width: 12px; height: 12px; background: #3978ed; }
  #form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  #form-grid input, #form-grid select, #form-grid textarea { width: 100%; padding: 8px; border: 1px solid #ccd4e0; font: inherit; }
  #fixed-label { position: fixed; right: 20px; bottom: 100px; z-index: 30; }
  #fixed-top { position: fixed; left: 10%; top: 5%; width: 80px; height: 30px; z-index: 1; background: #e0fff1; }
</style>
<main id="document">
  <section id="form-grid">
    <input id="name-input" value="김">
    <select id="selected-city"><option>서울</option><option selected>부산</option></select>
    <textarea id="memo">현재 입력된 내용</textarea>
    <div><input id="checkbox" type="checkbox" checked><input id="radio" type="radio" checked></div>
  </section>
  <div id="long-content"><strong>긴 문서의 일반 콘텐츠</strong><p>Normal flow remains intact.</p></div>
  <section id="clipped-parent">
    <div id="absolute-card"><strong>Parent bottom</strong><p>Absolute descendants</p></div>
    <div id="fixed-toolbar">
      <div id="toolbar-copy"><strong>Viewport bottom</strong><p>편집 가능한 자식 유지</p></div>
      <input id="toolbar-input" value="김" style="width:80px;padding:8px">
      <button id="toolbar-button">저장</button>
      <div id="toolbar-absolute"></div>
    </div>
    <span id="fixed-label">NEW</span>
    <div id="fixed-top">Top left</div>
  </section>
</main>
</html>
