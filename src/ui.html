<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--figma-color-text, #20232e); background: var(--figma-color-bg, #fff); font-size: 12px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    h1 { font-size: 23px; letter-spacing: -.7px; margin: 0 0 8px; font-weight: 650; }
    .intro { margin: 0 0 24px; line-height: 1.6; color: var(--figma-color-text-secondary, #687080); }
    .badge { display: inline-block; color: #5b50c7; background: #efedfc; padding: 4px 7px; border-radius: 5px; font-size: 10px; font-weight: 700; margin-bottom: 12px; letter-spacing: .7px; }
    .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1.5px dashed var(--figma-color-border, #d4d5df); border-radius: 12px; min-height: 158px; padding: 20px; cursor: pointer; background: var(--figma-color-bg-secondary, #fafafd); text-align: center; transition: border-color .15s; }
    .dropzone:hover, .dropzone.drag { border-color: #7365df; background: var(--figma-color-bg-brand-tertiary, #f5f3ff); }
    .dropzone svg { color: #7064ce; }
    .dropzone strong { font-size: 13px; font-weight: 600; word-break: break-all; }
    .muted { color: var(--figma-color-text-secondary, #777d8a); font-size: 11px; line-height: 1.5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .field { margin-top: 22px; display: grid; gap: 8px; }
    .field-label { font-weight: 600; }
    select, input[type="number"] { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--figma-color-border, #dadde5); border-radius: 7px; color: inherit; background: var(--figma-color-bg, #fff); font: inherit; }
    .dimensions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dimension { display: grid; gap: 6px; }
    input[aria-invalid="true"] { border-color: var(--figma-color-border-danger, #b13247); }
    #viewport-error { margin: 0; color: var(--figma-color-text-danger, #b13247); font-size: 11px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 22px; }
    .asset-picker { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .check { display: flex; gap: 9px; align-items: center; cursor: pointer; }
    input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: #7160d8; }
    button { border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
    #convert { color: #fff; background: #6b59d3; padding: 13px; font-size: 13px; font-weight: 600; width: 100%; }
    #convert:hover:enabled { background: #5847bd; }
    #convert:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 2px solid #8c7be7; outline-offset: 3px; }
    .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
    .secondary { background: transparent; color: var(--figma-color-text-secondary, #687080); padding: 5px 0; text-decoration: underline; font-size: 11px; }
    #status { margin: 16px 0 0; line-height: 1.6; font-size: 12px; }
    #status[data-state="error"] { color: var(--figma-color-text-danger, #b13247); }
    #status[data-state="success"] { color: var(--figma-color-text-success, #247556); }
    #report { border-top: 1px solid var(--figma-color-border, #e8e8ef); padding-top: 14px; margin-top: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat { background: var(--figma-color-bg-secondary, #f6f6fa); padding: 10px 6px; border-radius: 6px; text-align: center; }
    .stat strong { display: block; font-size: 19px; margin-bottom: 4px; }
    .stat span { font-size: 10px; color: var(--figma-color-text-secondary, #687080); }
    details { margin-top: 14px; }
    summary { cursor: pointer; font-weight: 600; }
    #warnings { padding-left: 18px; max-height: 160px; overflow-y: auto; line-height: 1.6; font-size: 11px; color: var(--figma-color-text-secondary, #687080); }
    #warnings li { margin-bottom: 8px; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="badge">EDITABLE IMPORT</div>
  <h1>HTML → Figma</h1>
  <p class="intro">HTML 화면을 Frame, Text, Auto Layout으로.<br>가져온 레이어를 Figma에서 바로 편집하세요.</p>
  <label class="dropzone" id="dropzone" tabindex="0" role="button" for="file" aria-label="HTML 파일 업로드">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 18V3m0 0L9 8m5-5 5 5M5 17v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <strong id="filename">HTML 파일 업로드</strong>
    <span class="muted" id="fileinfo">드래그하거나 클릭하여 선택 · .html · 최대 5MB</span>
  </label>
  <input class="sr-only" type="file" id="file" accept=".html,.htm,text/html" aria-label="HTML 파일 선택">
  <div class="asset-picker"><label class="secondary" for="asset-files">이미지 파일 추가 (선택)</label><span class="muted" id="asset-count">상대 경로 이미지용</span></div>
  <input class="sr-only" type="file" id="asset-files" multiple accept="image/*" aria-label="HTML에서 사용하는 이미지 파일 추가">
  <div class="field">
    <label class="field-label" for="viewport">Viewport</label>
    <select id="viewport"><option value="1440">Desktop 1440</option><option value="1280">Desktop 1280</option><option value="768">Tablet 768</option><option value="375">Mobile 375</option><option value="custom">직접 입력</option></select>
    <div class="dimensions">
      <label class="dimension" for="viewport-width"><span>너비 (px)</span><input id="viewport-width" type="number" min="1" max="10000" step="1" value="1440" inputmode="numeric" aria-describedby="viewport-help viewport-error"></label>
      <label class="dimension" for="viewport-height"><span>높이 (px)</span><input id="viewport-height" type="number" min="1" max="10000" step="1" value="900" inputmode="numeric" aria-describedby="viewport-help viewport-error"></label>
    </div>
    <span class="muted" id="viewport-help">HTML 렌더링 크기입니다. Frame 높이는 콘텐츠에 맞춰 생성됩니다.</span>
    <p id="viewport-error" role="alert" hidden>너비와 높이는 1~10,000px의 정수로 입력하세요.</p>
  </div>
  <div class="options">
    <label class="check"><input id="autolayout" type="checkbox" checked> Auto Layout 적용</label>
    <label class="check"><input id="styles" type="checkbox" checked> CSS 스타일 적용</label>
    <label class="check"><input id="images" type="checkbox" checked> Images</label>
    <label class="check"><input id="shadows" type="checkbox" checked> Shadows</label>
    <label class="check"><input id="optimize" type="checkbox" checked> 빈 Wrapper 정리</label>
    <label class="check"><input id="debug" type="checkbox"> Debug Mode</label>
  </div>
  <button id="convert" type="button" disabled>Figma로 변환</button>
  <div class="actions"><span class="muted">HTML 스크립트는 실행하지 않습니다.</span><button class="secondary" id="cancel" hidden type="button">취소</button><button class="secondary" id="json" hidden type="button">JSON 저장</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="report" hidden aria-label="변환 결과">
    <div class="stats"><div class="stat"><strong id="total-count">0</strong><span>총 Node</span></div><div class="stat"><strong id="frame-count">0</strong><span>Frames</span></div><div class="stat"><strong id="text-count">0</strong><span>Text</span></div><div class="stat"><strong id="image-count">0</strong><span>Images</span></div><div class="stat"><strong id="layout-count">0</strong><span>Auto Layout</span></div><div class="stat"><strong id="grid-count">0</strong><span>Grid</span></div><div class="stat"><strong id="absolute-count">0</strong><span>Absolute</span></div><div class="stat"><strong id="svg-count">0</strong><span>SVG Vector</span></div></div>
    <p class="muted" id="duration"></p>
    <details id="warning-details"><summary id="warning-summary">Warning 0</summary><ul id="warnings"></ul></details>
  </section>
  <div id="render-host"></div>
  <!-- UI_SCRIPT -->
</body>
</html>
