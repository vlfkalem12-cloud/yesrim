<!DOCTYPE html>
<html>
<head>
<style>

body {
  margin: 0;
  font-family: Arial;
}

.page {
  width: 1440px;
  display: flex;
  flex-direction: column;
  gap: 40px;
  padding: 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav {
  display: flex;
  gap: 24px;
}

.hero {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 40px;
  background: #f5f5f5;
  border-radius: 16px;
}

.card-list {
  display: flex;
  gap: 24px;
}

.card {
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
  border: 1px solid #ddd;
  border-radius: 12px;
}

</style>
</head>

<body>

<div class="page">

  <header class="header">

    <strong>LOGO</strong>

    <nav class="nav">
      <span>Product</span>
      <span>Guide</span>
      <span>Contact</span>
    </nav>

  </header>

  <section class="hero">

    <h1>HTML to Figma</h1>

    <p>
      Convert HTML into editable Figma Auto Layout.
    </p>

    <button>
      Get Started
    </button>

  </section>

  <section class="card-list">

    <div class="card">
      <h2>Auto Layout</h2>
      <p>Automatically convert Flexbox.</p>
    </div>

    <div class="card">
      <h2>Editable</h2>
      <p>Keep every Figma layer editable.</p>
    </div>

    <div class="card">
      <h2>Fast</h2>
      <p>Import HTML directly into Figma.</p>
    </div>

  </section>

</div>

</body>
</html>
