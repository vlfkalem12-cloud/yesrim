    images.disabled = shadows.disabled = optimize.disabled = debug.disabled = assetFiles.disabled = value;
    dropzone.setAttribute("aria-disabled", String(value));
    cancel.hidden = !value;
    if (!value) cancel.disabled = false;
    convert.textContent = conversionStatus === "converting" ? "\uBCC0\uD658 \uC911\u2026" : "Figma\uB85C \uBCC0\uD658";
  }
  function finishConversion(state, message, report) {
    requestId = null;
    cancelled = false;
    input.value = "";
    dropzone.classList.remove("drag");
    status(message, state);
    try {
      if (report) showReport(report);
    } catch (error) {
      get("report").hidden = true;
      status(`${message} \uBCF4\uACE0\uC11C\uB97C \uD45C\uC2DC\uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4: ${errorMessage(error)}`, state);
    } finally {
      renderControls();
    }
  }
  function readFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => typeof reader.result === "string" ? resolve(reader.result) : reject(new Error("HTML \uD30C\uC77C\uC744 \uC77D\uC744 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4."));
      reader.onerror = () => reject(new Error("\uD30C\uC77C \uC77D\uAE30\uC5D0 \uC2E4\uD328\uD588\uC2B5\uB2C8\uB2E4."));
      reader.onabort = () => reject(new Error("\uD30C\uC77C \uC77D\uAE30\uAC00 \uCDE8\uC18C\uB418\uC5C8\uC2B5\uB2C8\uB2E4."));
      reader.readAsText(file);
    });
  }
  async function selectFile(file) {
    if (isBusy() || !file) return;
    cancelled = false;
    requestId = null;
    input.value = "";
    if (!/\.html?$/i.test(file.name)) {
      status(".html \uB610\uB294 .htm \uD30C\uC77C\uC744 \uC120\uD0DD\uD558\uC138\uC694.", "error");
      return;
    }
    if (file.size > LIMITS.fileBytes) {
      status("\uD30C\uC77C\uC774 5MB \uC81C\uD55C\uC744 \uCD08\uACFC\uD588\uC2B5\uB2C8\uB2E4.", "error");
      return;
    }
    html = null;
    parsed = null;
    json.hidden = true;
    get("report").hidden = true;
    readingFiles = true;
    status("HTML \uD30C\uC77C\uC744 \uC77D\uACE0 \uC788\uC2B5\uB2C8\uB2E4.", "idle");
    renderControls();
    try {
      const content = await readFile(file);
      if (cancelled) return;
      if (!content.trim()) throw new Error("HTML \uD30C\uC77C\uC774 \uBE44\uC5B4 \uC788\uC2B5\uB2C8\uB2E4.");
      html = content;
      get("filename").textContent = file.name;
      get("fileinfo").textContent = `${(file.size / 1024).toFixed(1)} KB \xB7 \uB2E4\uB978 \uD30C\uC77C\uC744 \uC120\uD0DD\uD558\uB824\uBA74 \uD074\uB9AD`;
      status("\uC900\uBE44\uB418\uC5C8\uC2B5\uB2C8\uB2E4. Viewport\uB97C \uC124\uC815\uD558\uACE0 \uBCC0\uD658\uD558\uC138\uC694.");
    } catch (error) {
      status(errorMessage(error), "error");
    } finally {
      if (cancelled) status("\uD30C\uC77C \uC120\uD0DD\uC744 \uCDE8\uC18C\uD588\uC2B5\uB2C8\uB2E4.", "idle");
      cancelled = false;
      readingFiles = false;
      renderControls();
      input.value = "";
    }
  }
  input.addEventListener("change", () => {
    void selectFile(input.files?.[0]);
  });
  assetFiles.addEventListener("change", async () => {
    if (isBusy() || !assetFiles.files?.length) return;
    const files = [...assetFiles.files];
    if (files.length > 100 || files.some((file) => file.size > LIMITS.imageBytes) || files.reduce((sum, file) => sum + file.size, 0) > LIMITS.assetBytes) {
      status("\uC774\uBBF8\uC9C0\uB294 \uD30C\uC77C\uB2F9 4MB, \uCD1D 16MB, \uCD5C\uB300 100\uAC1C\uAE4C\uC9C0 \uCD94\uAC00\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.", "error");
      return;
    }
    cancelled = false;
    readingFiles = true;
    status("\uC774\uBBF8\uC9C0\uB97C \uC77D\uACE0 \uC788\uC2B5\uB2C8\uB2E4.", "idle");
    renderControls();
    try {
      const entries = await Promise.all(files.map(async (file) => {
        const data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => typeof reader.result === "string" ? resolve(reader.result) : reject(new Error("\uC774\uBBF8\uC9C0 \uC77D\uAE30 \uC2E4\uD328"));
          reader.onerror = () => reject(new Error("\uC774\uBBF8\uC9C0 \uC77D\uAE30 \uC2E4\uD328"));
          reader.readAsDataURL(file);
        });
        if (!/^data:image\//i.test(data)) throw new Error(`${file.name}\uC740 \uC9C0\uC6D0\uD558\uB294 \uC774\uBBF8\uC9C0 \uD30C\uC77C\uC774 \uC544\uB2D9\uB2C8\uB2E4.`);
        return { path: file.webkitRelativePath || file.name, basename: file.name, data };
      }));
      if (cancelled) return;
      localAssets = {};
      const duplicates = new Set(entries.filter((entry) => entries.filter((other) => other.basename === entry.basename).length > 1).map((entry) => entry.basename));
      for (const entry of entries) {
        if (!duplicates.has(entry.path)) localAssets[entry.path] = entry.data;
        if (!duplicates.has(entry.basename)) localAssets[entry.basename] = entry.data;
      }
      get("asset-count").textContent = `${files.length}\uAC1C \uC120\uD0DD`;
      status(duplicates.size ? `\uC774\uB984\uC774 \uC911\uBCF5\uB41C \uC774\uBBF8\uC9C0 ${[...duplicates].join(", ")}\uB294 \uACBD\uB85C\uAC00 \uC77C\uCE58\uD560 \uB54C\uB9CC \uC0AC\uC6A9\uD569\uB2C8\uB2E4.` : "\uC774\uBBF8\uC9C0\uB97C \uCD94\uAC00\uD588\uC2B5\uB2C8\uB2E4. HTML \uBCC0\uD658 \uC2DC \uC0C1\uB300 \uACBD\uB85C\uC5D0 \uC801\uC6A9\uD569\uB2C8\uB2E4.");
    } catch (error) {
      status(errorMessage(error), "error");
    } finally {
      if (cancelled) status("\uC774\uBBF8\uC9C0 \uC120\uD0DD\uC744 \uCDE8\uC18C\uD588\uC2B5\uB2C8\uB2E4.", "idle");
      cancelled = false;
      readingFiles = false;
      renderControls();
      assetFiles.value = "";
    }
  });
  dropzone.addEventListener("keydown", (event) => {
    if (!isBusy() && ["Enter", " "].includes(event.key)) {
      event.preventDefault();
      input.value = "";
      input.click();
    }
  });
  dropzone.addEventListener("click", (event) => {
    if (isBusy()) event.preventDefault();
  });
  for (const type of ["dragenter", "dragover"]) dropzone.addEventListener(type, (event) => {
    event.preventDefault();
    if (!isBusy()) dropzone.classList.add("drag");
  });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop", (event) => {
    event.preventDefault();
    dropzone.classList.remove("drag");
    void selectFile(event.dataTransfer?.files[0]);
  });
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());
  convert.addEventListener("click", async () => {
    if (isBusy() || html === null) return;
    if (!validateViewport()) return;
    requestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    cancelled = false;
    parsed = null;
    get("report").hidden = true;
    json.hidden = true;
    status("HTML\uC744 \uB80C\uB354\uB9C1\uD558\uACE0 \uB808\uC774\uC544\uC6C3\uC744 \uBD84\uC11D\uD569\uB2C8\uB2E4\u2026", "converting");
    renderControls();
    try {
      parsed = await parseHTML(html, {
        viewport: viewportWidth.valueAsNumber,
        viewportHeight: viewportHeight.valueAsNumber,
        autoLayout: autoLayout.checked,
        styles: styles.checked,
        images: images.checked,
        shadows: shadows.checked,
        optimizeWrappers: optimize.checked,
        debug: debug.checked
      }, get("render-host"), localAssets);
      if (cancelled) {
        finishConversion("error", "\uBCC0\uD658\uC744 \uCDE8\uC18C\uD588\uC2B5\uB2C8\uB2E4.");
        return;
      }
      console.info("HTML \u2192 Figma intermediate document", parsed);
      json.hidden = false;
      status("Figma \uB808\uC774\uC5B4\uB97C \uC0DD\uC131\uD569\uB2C8\uB2E4\u2026");
      send({ type: "CREATE_FIGMA", requestId, payload: parsed });
    } catch (error) {
      finishConversion("error", errorMessage(error));
    }
  });
  cancel.addEventListener("click", () => {
    cancelled = true;
    if (conversionStatus === "converting") send({ type: "CANCEL" });
    status("\uBCC0\uD658\uC744 \uCDE8\uC18C\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4\u2026");
    cancel.disabled = true;
  });
  json.addEventListener("click", () => {
    if (!parsed) return;
    const url = URL.createObjectURL(new Blob([JSON.stringify(parsed, null, 2)], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = "html-to-figma.json";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1e3);
  });
  function showReport(report) {
    get("report").hidden = false;
    for (const [id, value] of [["total-count", report.total], ["frame-count", report.frames], ["layout-count", report.autoLayout], ["text-count", report.text], ["image-count", report.image], ["grid-count", report.grid], ["absolute-count", report.absolute], ["svg-count", report.svg]]) get(id).textContent = String(value);
    get("duration").textContent = `Figma \uB178\uB4DC \uC0DD\uC131: ${(report.durationMs / 1e3).toFixed(2)}\uCD08`;
    get("warning-summary").textContent = `Warning ${report.warnings.length}`;
    const list = get("warnings");
    list.replaceChildren();
    for (const [category, count] of Object.entries(report.warningGroups)) {
      const group = document.createElement("li");
      const title = document.createElement("strong");
      title.textContent = `${category}: ${count}`;
      group.append(title);
      const items = document.createElement("ul");
      for (const warning of report.warnings.filter((warning2) => warning2.category === category)) {
        const li = document.createElement("li");
        li.textContent = `${warning.element || warning.node} \u2014 ${warning.code}: ${warning.message}`;
        items.append(li);
      }
      group.append(items);
      list.append(group);
    }
    get("warning-details").hidden = report.warnings.length === 0;
  }
  window.addEventListener("message", (event) => {
    const message = event.data?.pluginMessage;
    if (!message || typeof message !== "object" || message.requestId !== requestId || conversionStatus !== "converting") return;
    if (message.type === "PROGRESS") {
      status(`${message.count}\uAC1C\uC758 \uB808\uC774\uC5B4\uB97C \uC0DD\uC131\uD588\uC2B5\uB2C8\uB2E4\u2026`);
      return;
    }
    if (message.type === "CONVERSION_COMPLETE") finishConversion("success", "\u2713 \uBCC0\uD658 \uC644\uB8CC \xB7 \uB2E4\uB978 HTML \uD30C\uC77C\uC744 \uC120\uD0DD\uD558\uAC70\uB098 \uB2E4\uC2DC \uBCC0\uD658\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.", message.payload?.report);
    else if (message.type === "CONVERSION_ERROR") finishConversion("error", message.payload?.message || "\uBCC0\uD658 \uC911 \uC54C \uC218 \uC5C6\uB294 \uC624\uB958\uAC00 \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4.");
  });
  get("status").dataset.state = conversionStatus;
  renderControls();
})();
</script>
</body>
</html>
